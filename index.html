<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Статистика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .goal-row {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .progress-bar {
            background-color: #ddd;
            border-radius: 8px;
            height: 10px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: var(--tg-theme-button-color, #2481cc);
            height: 100%;
            width: 0%;
            transition: width 0.8s ease;
        }
        .workout-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
            font-size: 15px;
        }
        .workout-item:last-child {
            border-bottom: none;
        }
        .workout-details {
            color: var(--tg-theme-hint-color, #999);
            font-size: 13px;
            margin-top: 2px;
        }
        #loader {
            text-align: center;
            margin-top: 50px;
            color: var(--tg-theme-hint-color, #999);
        }
    </style>
</head>
<body>

    <div id="loader">Загрузка данных из таблицы...</div>

    <div id="content" style="display: none;">
        <div class="card">
            <div class="title">Цели на неделю</div>
            <div class="goal-row">
                🏃 Кардио: <span id="cardio-text">0 / 150 мин</span>
                <div class="progress-bar"><div id="cardio-bar" class="progress-fill"></div></div>
            </div>
            <div class="goal-row" style="margin-top: 12px;">
                🏋️ Силовые: <span id="strength-text">0 / 2 тренировки</span>
                <div class="progress-bar"><div id="strength-bar" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="title">Последние тренировки</div>
            <div id="workout-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Ваш API
        const API_URL = 'https://script.google.com/macros/s/AKfycbztcCHGCseFQQjsjtDOjLjNOTAYqXczKJjbBtIsdGr1pvEwr-TuJcDQ2HqIlNbBZJuq/exec';

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderData(data);
            } catch (error) {
                document.getElementById('loader').innerText = 'Ошибка загрузки данных';
            }
        }

        // Вспомогательная функция для превращения строки "14.08.2026" в дату
        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const parts = dateStr.split('.');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            return new Date(0);
        }

        function renderData(data) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // 1. СОРТИРОВКА: Сначала свежие тренировки
            data.sort((a, b) => parseDate(b['Дата']) - parseDate(a['Дата']));

            // 2. ВЫЧИСЛЕНИЕ ТЕКУЩЕЙ НЕДЕЛИ (Пн-Вс)
            const now = new Date();
            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay(); // Делаем Пн=1, Вс=7
            
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            // 3. ПОДСЧЕТ ЦЕЛЕЙ ТОЛЬКО ЗА ТЕКУЩУЮ НЕДЕЛЮ
            let cardioMinutes = 0;
            let strengthCount = 0;
            
            data.forEach(row => {
                const rowDate = parseDate(row['Дата']);
                
                // Если тренировка входит в текущую неделю
                if (rowDate >= startOfWeek && rowDate <= endOfWeek) {
                    const type = (row['Тип тренировки'] || '').toLowerCase();
                    const duration = Number(row['Длительность (мин)']) || 0;
                    
                    if (type.includes('силовы') || type.includes('силовая')) {
                        strengthCount += 1;
                    } else if (type !== '') {
                        cardioMinutes += duration;
                    }
                }
            });

            // Обновляем шкалы
            const cardioPercent = Math.min((cardioMinutes / 150) * 100, 100);
            document.getElementById('cardio-text').innerText = `${cardioMinutes} / 150 мин`;
            document.getElementById('cardio-bar').style.width = `${cardioPercent}%`;

            const strengthPercent = Math.min((strengthCount / 2) * 100, 100);
            document.getElementById('strength-text').innerText = `${strengthCount} / 2 тренировки`;
            document.getElementById('strength-bar').style.width = `${strengthPercent}%`;

            // 4. ОТРИСОВКА СПИСКА (первые 5 элементов из отсортированного массива)
            const listContainer = document.getElementById('workout-list');
            listContainer.innerHTML = '';
            
            data.slice(0, 5).forEach(row => {
                const date = row['Дата'] || 'Без даты';
                const type = row['Тип тренировки'] || 'Активность';
                const distance = row['Дистанция (км)'] ? `${row['Дистанция (км)']} км` : '';
                const duration = row['Длительность (мин)'] ? `${row['Длительность (мин)']} мин` : '';
                
                const details = [distance, duration].filter(Boolean).join(' • ');

                const div = document.createElement('div');
                div.className = 'workout-item';
                div.innerHTML = `
                    <div>
                        <div>${type}</div>
                        <div class="workout-details">${date}</div>
                    </div>
                    <div style="font-weight: 500;">${details}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        fetchData();
    </script>
</body>
</html>
