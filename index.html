<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя статистика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); margin: 0; padding: 16px; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
        .goal-row { margin-bottom: 8px; font-size: 14px; }
        .progress-bar { background-color: #ddd; border-radius: 8px; height: 10px; width: 100%; margin-top: 4px; overflow: hidden; }
        .progress-fill { background-color: var(--tg-theme-button-color, #2481cc); height: 100%; width: 0%; transition: width 0.8s ease; }
        .workout-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--tg-theme-hint-color, #ccc); font-size: 15px; }
        .workout-item:last-child { border-bottom: none; }
        .workout-details { color: var(--tg-theme-hint-color, #999); font-size: 13px; margin-top: 2px; }
        #loader { text-align: center; margin-top: 50px; color: var(--tg-theme-hint-color, #999); }
        .refresh-btn { background-color: var(--tg-theme-button-color, #2481cc); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 16px; }
        .refresh-btn:active { opacity: 0.8; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .last-updated { text-align: center; font-size: 12px; color: var(--tg-theme-hint-color, #999); margin-bottom: 12px; }
    </style>
</head>
<body>
    <div id="loader">Загрузка данных из таблицы...</div>

    <div id="content" style="display: none;">
        <div class="last-updated" id="last-updated"></div>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">🔄 Обновить данные</button>

        <div class="card">
            <div class="title">Цели на неделю</div>
            <div class="goal-row">
                🏃 Кардио: <span id="cardio-text">0 / 150 мин</span>
                <div class="progress-bar"><div id="cardio-bar" class="progress-fill"></div></div>
            </div>
            <div class="goal-row" style="margin-top: 12px;">
                💪 Силовые: <span id="strength-text">0 / 2 тренировки</span>
                <div class="progress-bar"><div id="strength-bar" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="title">Последние тренировки</div>
            <div id="workout-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) tg.expand();

        // Запрос идёт через Vercel HTTPS-прокси, чтобы Telegram не блокировал HTTP API VPS.
        const API_URL = "/api/fitness-data";

        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const match = String(dateStr).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            return match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : new Date(0);
        }

        function setLoading(isLoading) {
            document.getElementById("loader").style.display = isLoading ? "block" : "none";
            document.getElementById("content").style.display = isLoading ? "none" : "block";
        }

        async function fetchData() {
            setLoading(true);
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                if (!Array.isArray(data)) throw new Error("API вернул данные в неверном формате");

                renderData(data);
                document.getElementById("last-updated").innerText = `Последнее обновление: ${new Date().toLocaleTimeString("ru-RU")}`;
                setLoading(false);
            } catch (error) {
                console.error("Ошибка при загрузке:", error);
                document.getElementById("loader").innerText = `Ошибка загрузки данных: ${error.message}`;
            }
        }

        function refreshData() {
            const button = document.getElementById("refresh-btn");
            button.disabled = true;
            button.innerText = "⏳ Обновление...";
            fetchData().finally(() => {
                button.disabled = false;
                button.innerText = "🔄 Обновить данные";
            });
        }

        function renderData(data) {
            data.sort((a, b) => parseDate(b["Дата"]) - parseDate(a["Дата"]));

            const now = new Date();
            const dayOfWeek = now.getDay() || 7;
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            let cardioMinutes = 0;
            let strengthCount = 0;

            data.forEach(row => {
                const rowDate = parseDate(row["Дата"]);
                if (rowDate < startOfWeek || rowDate > endOfWeek) return;

                const type = String(row["Тип тренировки"] || "").toLowerCase();
                const duration = Number(String(row["Длительность (мин)"] || "").replace(",", ".")) || 0;
                if (type.includes("силов") || type.includes("strength")) strengthCount++;
                else if (type) cardioMinutes += duration;
            });

            document.getElementById("cardio-text").innerText = `${cardioMinutes} / 150 мин`;
            document.getElementById("cardio-bar").style.width = `${Math.min(cardioMinutes / 150 * 100, 100)}%`;
            document.getElementById("strength-text").innerText = `${strengthCount} / 2 тренировки`;
            document.getElementById("strength-bar").style.width = `${Math.min(strengthCount / 2 * 100, 100)}%`;

            const list = document.getElementById("workout-list");
            list.innerHTML = "";
            data.slice(0, 5).forEach(row => {
                const date = row["Дата"] || "Без даты";
                const type = row["Тип тренировки"] || "Активность";
                const distance = row["Дистанция (км)"] ? `${row["Дистанция (км)"]} км` : "";
                const duration = row["Длительность (мин)"] ? `${row["Длительность (мин)"]} мин` : "";
                const details = [distance, duration].filter(Boolean).join(" • ");

                const item = document.createElement("div");
                item.className = "workout-item";
                item.innerHTML = `<div><div>${type}</div><div class="workout-details">${date}</div></div><div>${details}</div>`;
                list.appendChild(item);
            });
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
