<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РњРѕСЏ РЎС‚Р°С‚РёСЃС‚РёРєР°</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .goal-row {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .progress-bar {
            background-color: #ddd;
            border-radius: 8px;
            height: 10px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: var(--tg-theme-button-color, #2481cc);
            height: 100%;
            width: 0%;
            transition: width 0.8s ease;
        }
        .workout-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
            font-size: 15px;
        }
        .workout-item:last-child {
            border-bottom: none;
        }
        .workout-details {
            color: var(--tg-theme-hint-color, #999);
            font-size: 13px;
            margin-top: 2px;
        }
        #loader {
            text-align: center;
            margin-top: 50px;
            color: var(--tg-theme-hint-color, #999);
        }
        .refresh-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
            transition: opacity 0.2s;
        }
        .refresh-btn:active {
            opacity: 0.8;
        }
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .last-updated {
            text-align: center;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div id="loader">Р—Р°РіСЂСѓР·РєР° РґР°РЅРЅС‹С… РёР· С‚Р°Р±Р»РёС†С‹...</div>

    <div id="content" style="display: none;">
        <div class="last-updated" id="last-updated"></div>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">рџ”„ РћР±РЅРѕРІРёС‚СЊ РґР°РЅРЅС‹Рµ</button>
        
        <div class="card">
            <div class="title">Р¦РµР»Рё РЅР° РЅРµРґРµР»СЋ</div>
            <div class="goal-row">
                рџЏѓ РљР°СЂРґРёРѕ: <span id="cardio-text">0 / 150 РјРёРЅ</span>
                <div class="progress-bar"><div id="cardio-bar" class="progress-fill"></div></div>
            </div>
            <div class="goal-row" style="margin-top: 12px;">
                рџЏ‹пёЏ РЎРёР»РѕРІС‹Рµ: <span id="strength-text">0 / 2 С‚СЂРµРЅРёСЂРѕРІРєРё</span>
                <div class="progress-bar"><div id="strength-bar" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="title">РџРѕСЃР»РµРґРЅРёРµ С‚СЂРµРЅРёСЂРѕРІРєРё</div>
            <div id="workout-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbwvHJtJp7QnXnlNcCR1zyxdm4oUqGmO9ZlFMfGpNGAQhGM9gqYNVAc2MFgv_2FQVQTA/useFunctionUrl';

        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const parts = dateStr.split('.');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            return new Date(0);
        }

        async function fetchData() {
            try {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('content').style.display = 'none';

                const response = await fetch(API_URL + '?t=' + Date.now());
                const data = await response.json();
                
                renderData(data);

                const now = new Date();
                const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('last-updated').innerText = `РџРѕСЃР»РµРґРЅРµРµ РѕР±РЅРѕРІР»РµРЅРёРµ: ${timeStr}`;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('РћС€РёР±РєР° РїСЂРё Р·Р°РіСЂСѓР·РєРµ:', error);
                document.getElementById('loader').innerText = 'РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РґР°РЅРЅС‹С…';
            }
        }

        function refreshData() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.innerText = 'вЏі РћР±РЅРѕРІР»РµРЅРёРµ...';
            
            fetchData().then(() => {
                btn.disabled = false;
                btn.innerText = 'рџ”„ РћР±РЅРѕРІРёС‚СЊ РґР°РЅРЅС‹Рµ';
            }).catch(err => {
                console.error('РћС€РёР±РєР° РѕР±РЅРѕРІР»РµРЅРёСЏ:', err);
                btn.disabled = false;
                btn.innerText = 'рџ”„ РћР±РЅРѕРІРёС‚СЊ РґР°РЅРЅС‹Рµ';
            });
        }

        function renderData(data) {
            data.sort((a, b) => parseDate(b['Р”Р°С‚Р°']) - parseDate(a['Р”Р°С‚Р°']));

            const now = new Date();
            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
            
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);

            let cardioMinutes = 0;
            let strengthCount = 0;
            
            data.forEach(row => {
                const rowDate = parseDate(row['Р”Р°С‚Р°']);
                
                if (rowDate >= startOfWeek && rowDate <= endOfWeek) {
                    const type = (row['РўРёРї С‚СЂРµРЅРёСЂРѕРІРєРё'] || '').toLowerCase();
                    const duration = Number(row['Р”Р»РёС‚РµР»СЊРЅРѕСЃС‚СЊ (РјРёРЅ)']) || 0;
                    
                    if (type.includes('СЃРёР»РѕРІС‹') || type.includes('СЃРёР»РѕРІР°СЏ')) {
                        strengthCount += 1;
                    } else if (type !== '') {
                        cardioMinutes += duration;
                    }
                }
            });

            const cardioPercent = Math.min((cardioMinutes / 150) * 100, 100);
            document.getElementById('cardio-text').innerText = `${cardioMinutes} / 150 РјРёРЅ`;
            document.getElementById('cardio-bar').style.width = `${cardioPercent}%`;

            const strengthPercent = Math.min((strengthCount / 2) * 100, 100);
            document.getElementById('strength-text').innerText = `${strengthCount} / 2 С‚СЂРµРЅРёСЂРѕРІРєРё`;
            document.getElementById('strength-bar').style.width = `${strengthPercent}%`;

            const listContainer = document.getElementById('workout-list');
            listContainer.innerHTML = '';
            
            data.slice(0, 5).forEach(row => {
                const date = row['Р”Р°С‚Р°'] || 'Р‘РµР· РґР°С‚С‹';
                const type = row['РўРёРї С‚СЂРµРЅРёСЂРѕРІРєРё'] || 'РђРєС‚РёРІРЅРѕСЃС‚СЊ';
                const distance = row['Р”РёСЃС‚Р°РЅС†РёСЏ (РєРј)'] ? `${row['Р”РёСЃС‚Р°РЅС†РёСЏ (РєРј)']} РєРј` : '';
                const duration = row['Р”Р»РёС‚РµР»СЊРЅРѕСЃС‚СЊ (РјРёРЅ)'] ? `${row['Р”Р»РёС‚РµР»СЊРЅРѕСЃС‚СЊ (РјРёРЅ)']} РјРёРЅ` : '';
                
                const details = [distance, duration].filter(Boolean).join(' вЂў ');

                const div = document.createElement('div');
                div.className = 'workout-item';
                div.innerHTML = `
                    <div>
                        <div>${type}</div>
                        <div class="workout-details">${date}</div>
                    </div>
                    <div style="font-weight: 500;">${details}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
